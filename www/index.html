<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پیام‌رسان آزمایشی</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0fdfa;
      color: #134e4a;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 4px 18px #0001;
    }
    button {
      background: #0f766e;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>پیام‌رسان آزمایشی</h2>
    <p>نسخهٔ آزمایشی برنامه آماده است.</p>
    <button onclick="alert('برنامه درست کار می‌کند')">آزمایش برنامه</button>
  </div>
</body>
</html>
